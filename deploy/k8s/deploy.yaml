apiVersion: apps/v1
kind: Deployment
metadata:
  name: sp-api-service
  labels:
    app: sp-api-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sp-api-service
  template:
    metadata:
      labels:
        app: sp-api-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sp-server
          image: sp-api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          env:
            - name: SP_ENV
              value: "production"
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: sp-api-service
  labels:
    app: sp-api-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
      protocol: TCP
  selector:
    app: sp-api-service
