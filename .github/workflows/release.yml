name: Release SP Language Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Package Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            archive: zip
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: macos-13
            target: macos-x86_64
            archive: tar.gz

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Configure CMake
      run: >
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DSP_BUILD_TESTS=ON
        -DSP_ENABLE_LLVM=ON

    - name: Build Toolchain Executables
      run: cmake --build build --config Release --target spc spm spls spd

    - name: Run Test Suite
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Create Distribution Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $pkgDir = "dist/sp-1.0.0-${{ matrix.target }}"
        New-Item -ItemType Directory -Force -Path "$pkgDir/bin" | Out-Null
        Copy-Item build/bin/*.exe "$pkgDir/bin/"
        Copy-Item -Recurse stdlib "$pkgDir/stdlib"
        Copy-Item -Recurse runtime/include "$pkgDir/include"
        Copy-Item -Recurse runtime/src "$pkgDir/runtime"
        Copy-Item README.md, LICENSE, SP-Syntax-Guide.md "$pkgDir/"
        Compress-Archive -Path "$pkgDir/*" -DestinationPath "sp-1.0.0-${{ matrix.target }}.zip"
        Get-FileHash -Algorithm SHA256 "sp-1.0.0-${{ matrix.target }}.zip" | Out-File "sp-1.0.0-${{ matrix.target }}.zip.sha256"

    - name: Create Distribution Package (POSIX)
      if: runner.os != 'Windows'
      run: |
        PKG_DIR="dist/sp-1.0.0-${{ matrix.target }}"
        mkdir -p "$PKG_DIR/bin"
        cp build/bin/spc build/bin/spm build/bin/spls build/bin/spd "$PKG_DIR/bin/"
        cp -r stdlib "$PKG_DIR/stdlib"
        cp -r runtime/include "$PKG_DIR/include"
        cp -r runtime/src "$PKG_DIR/runtime"
        cp README.md LICENSE SP-Syntax-Guide.md "$PKG_DIR/"
        tar -czf "sp-1.0.0-${{ matrix.target }}.tar.gz" -C "$PKG_DIR" .
        shasum -a 256 "sp-1.0.0-${{ matrix.target }}.tar.gz" > "sp-1.0.0-${{ matrix.target }}.tar.gz.sha256"

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          sp-1.0.0-${{ matrix.target }}.zip*
          sp-1.0.0-${{ matrix.target }}.tar.gz*
