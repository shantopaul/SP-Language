      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="100%" stop-color="#0057FF" />
    </linearGradient>
    <linearGradient id="spRibbonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057FF" />
